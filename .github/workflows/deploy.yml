name: Deploy

on:
  workflow_dispatch:
  release:
    types:
      - published

jobs:
  npm:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 1
#      - name: Extract tag
#        id: extract_tag
#        run: echo "tag=${GITHUB_REF/refs\/tags\//}" >> $GITHUB_OUTPUT
#      - uses: reedyuk/npm-version@1.2.2
#        with:
#          git-tag-version: false
#          version: ${{ steps.extract_tag.outputs.tag }}
      - uses: keloran/version-bump@c25548abe32c78adac98a4786e821cf3cf0990d2 # main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.x" # npm >= 11.5.1 for trusted publishing (OIDC)
          registry-url: "https://registry.npmjs.org"
      - uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3
        with:
          version: 9
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Rollup
        run: pnpm run build
      - name: NPM
        # trusted publishing: npm exchanges the OIDC token, provenance is automatic
        run: npm publish --no-git-checks
